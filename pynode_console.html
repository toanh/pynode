<!DOCTYPE html>

<html>
<head>
    <title>PyNode</title>
    <meta name="description" content="Interactive online Graph Theory.">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="coi-serviceworker.js"></script>
    <!-- Apply a stored theme before the stylesheet paints, so there is no flash of the
         wrong colours. Only writes the attribute when the user has chosen; while it is
         absent the stylesheet default applies, which is dark. -->
    <script>(function(){try{var t=localStorage.getItem("pynode-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link href="css/style.css?version=0.9.26" rel="stylesheet" type="text/css">
    <script src="js/pynode_theme.js?version=0.9.21"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>

<body class="pynode_console">
<div class="pynodeConsoleContainer">
    <div class="consolePageWrapper">
        <div class="consoleWrapper">
            <div class="appSectionTitle">
                <h3>Console</h3>
            </div>
            <div class="consoleBox">
                <div id="console"></div>
                <script>document.getElementById("console").innerHTML = "<p>Loading...</p>"</script>
            </div>
        </div>
    </div>
</div>
<script>
    function writeOutput(data, append) {
        var el = document.getElementById("console");
        if (!el) return;
        // See the note in index.html: innerHTML += would destroy the live input() field.
        if (append) el.insertAdjacentHTML("beforeend", data);
        else el.innerHTML = data;
        el.scrollTop = el.scrollHeight;
    }

    // Announce ourselves so the opener copies in the transcript so far and moves a
    // pending input() field here; on close it moves the field back. The opener repeats
    // both from its own handlers, which window.open's named-window reuse can attach too
    // late. Idempotent either way.
    function hostCall(fn) {
        try {
            if (window.opener && window.opener.PyNodeHost) window.opener.PyNodeHost[fn](window);
        } catch (e) { console.error("PyNode: opener unreachable", e); }
    }
    hostCall("consoleOpened");
    window.addEventListener("pagehide", function () { hostCall("consoleClosing"); });
</script>
</body>
</html>
