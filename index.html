<!DOCTYPE html>
<html>
<head>
    <title>PyNode</title>
    <meta name="description" content="Interactive online Graph Theory.">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Must load before anything else: it may reload the page. Lives at the repo root (not js/)
         because a service worker's scope is its own directory, and GitHub Pages cannot send the
         Service-Worker-Allowed header needed to widen it. No ?version= so the SW URL stays stable. -->
    <script src="coi-serviceworker.js"></script>
    <!-- Apply a stored theme before the stylesheet paints, so there is no flash of the
         wrong colours. Only writes the attribute when the user has chosen; while it is
         absent the stylesheet default applies, which is dark. -->
    <script>(function(){try{var t=localStorage.getItem("pynode-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link href="css/style.css?version=0.9.26" rel="stylesheet" type="text/css">
    <script src="js/pynode_theme.js?version=0.9.21"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="js/resize.js?version=0.9.16"></script>
    <script src="js/d3_controls.js?version=0.9.7"></script>
    <script src="js/graph_api.js?version=0.9.17"></script>
    <script src="js/d3/d3.v3.min.js?version=0.9.7"></script>
    <script src="js/cola/cola.v3.js?version=0.9.7"></script>
    <script src="js/greuler/greuler.js?version=0.9.8"></script>
    <script>
        var editor_exists = false;
        var pynode_output;
        var pynode_editor;
        var pynode_console;
        var pynode_docs;
        var pynode_debug;
        var enable_editor = true;

        // window.open features for a popup of the requested size, shrunk to fit the
        // screen and centred on it. A fixed 800x690 put the output popup's button bar off
        // the bottom of a 1080p screen at 150% scaling.
        function popupFeatures(w, h) {
            var availW = screen.availWidth || screen.width, availH = screen.availHeight || screen.height;
            w = Math.min(w, availW - 40);
            h = Math.min(h, availH - 80);
            var left = (screen.availLeft || 0) + (availW - w) / 2;
            var top = (screen.availTop || 0) + (availH - h) / 2;
            return "directories=no,titlebar=no,toolbar=no,location=no,status=no,menubar=no,width=" + w + ",height=" + h + ",left=" + left + ",top=" + top;
        }

        function hostReady() { return typeof PyNodeHost !== "undefined"; }

        // Popping the output out MOVES the live graph into the popup, and closing it moves
        // the graph back - see popOut/popIn in js/pynode_host.js. The popup announces both
        // itself; these handlers repeat it because window.open reuses the named window, so
        // they can be attached too late to fire, and a stale cached popup page may not
        // announce at all. Every call is idempotent.
        function outputPopup(w, h) {
            if (pynode_output !== undefined) {
                if (hostReady()) PyNodeHost.outputClosing(pynode_output);
                pynode_output.close()
            }
            // ?version= on the PAGE url, not just its script tags: a detached window's
            // behaviour lives in its own inline scripts, and without this a returning
            // browser can serve a stale copy of the page forever. Bump alongside the
            // script versions whenever a pynode_*.html inline script changes.
            var win = pynode_output = window.open("pynode_output.html?version=0.9.25", "PyNode Output", popupFeatures(w, h));
            win.onload = function () {
                if (hostReady()) PyNodeHost.outputOpened(win);
            };
            win.onbeforeunload = function () {
                if (hostReady()) PyNodeHost.outputClosing(win);
                if (pynode_output === win) pynode_output = undefined;
            };
            if (window.focus) {
                win.focus()
            }
            return false;
        }

        function bringBackOutput() {
            if (pynode_output !== undefined) {
                if (hostReady()) PyNodeHost.outputClosing(pynode_output);
                pynode_output.close();
            }
            return false;
        }

        function editorPopup(w, h) {
            if (pynode_editor !== undefined) {
                pynode_editor.close()
            }
            pynode_editor = window.open("pynode_editor.html?version=0.9.26", "PyNode Editor", popupFeatures(w, h));
            pynode_editor.onbeforeunload = function () {
                pynode_editor = undefined;
            };
            if (window.focus) {
                pynode_editor.focus()
            }
            return false;
        }

        // The popup starts with the transcript so far, and a pending input() field moves
        // into it. Same belt-and-braces announcement as outputPopup.
        function consolePopup(w, h) {
            if (pynode_console !== undefined) {
                if (hostReady()) PyNodeHost.consoleClosing(pynode_console);
                pynode_console.close()
            }
            var win = pynode_console = window.open("pynode_console.html?version=0.9.17", "PyNode Console", popupFeatures(w, h));
            win.onload = function () {
                if (hostReady()) PyNodeHost.consoleOpened(win);
            };
            win.onbeforeunload = function () {
                if (hostReady()) PyNodeHost.consoleClosing(win);
                if (pynode_console === win) pynode_console = undefined;
            };
            if (window.focus) {
                win.focus()
            }
            return false;
        }

        // The debugger window: call stack, variables, watches and the execution trace. It
        // is seeded with the current stop on open (PyNodeHost.debugOpened), like the console.
        function debugPopup(w, h) {
            if (pynode_debug !== undefined && !pynode_debug.closed) {
                pynode_debug.focus();
                return false;
            }
            var win = pynode_debug = window.open("pynode_debug.html?version=0.9.27", "PyNode Debugger", popupFeatures(w, h));
            win.onload = function () {
                if (hostReady()) PyNodeHost.debugOpened(win);
            };
            win.onbeforeunload = function () {
                if (hostReady()) PyNodeHost.debugClosing(win);
                if (pynode_debug === win) pynode_debug = undefined;
            };
            return false;
        }

        // Debugger keys outside the editor too (Monaco has its own bindings for when it has
        // focus). F11 would otherwise toggle full screen and F8/F10 do browser things.
        document.addEventListener("keydown", function (ev) {
            if (typeof PyNodeHost === "undefined") return;
            // Monaco binds these itself while focused; handling them here too would step twice.
            if (ev.target && ev.target.closest && ev.target.closest(".monaco-editor")) return;
            var fn = ev.key === "F8" ? "continueRun" : ev.key === "F10" ? "stepOver"
                   : ev.key === "F11" ? (ev.shiftKey ? "stepOut" : "stepInto") : null;
            if (!fn) return;
            ev.preventDefault();
            PyNodeHost[fn]();
        });

        function docsPopup(w, h) {
            if (pynode_docs !== undefined) {
                pynode_docs.close()
            }
            pynode_docs = window.open("pynode_docs.html?version=0.9.27", "PyNode Docs", popupFeatures(w, h));
            pynode_docs.onbeforeunload = function () {
                pynode_docs = undefined;
            };
            if (window.focus) {
                pynode_docs.focus()
            }
            return false;
        }

        // The drawer is empty until first opened: it fetches pynode_docs.html and lifts out
        // its .docsContent, so the documentation markup lives in that one file only.
        var docs_loaded = false;

        function toggleDocs(open) {
            if (open === undefined) open = !document.body.classList.contains("docs-open");
            document.body.classList.toggle("docs-open", open);
            var drawer = document.getElementById("docsDrawer");
            drawer.setAttribute("aria-hidden", open ? "false" : "true");
            if (open && !docs_loaded) {
                docs_loaded = true;
                fetch("pynode_docs.html?version=0.9.27")
                    .then(function (r) { return r.text(); })
                    .then(function (html) {
                        var doc = new DOMParser().parseFromString(html, "text/html");
                        drawer.querySelector(".docsContent").innerHTML = doc.querySelector(".docsContent").innerHTML;
                    })
                    .catch(function () {
                        docs_loaded = false;
                        drawer.querySelector(".docsContent").innerHTML = "<p>Could not load the documentation.</p>";
                    });
            }
        }

        function openExample(name) {
            openCode(name, true);
            var menu = document.querySelector(".examplesMenu");
            if (menu) menu.open = false;
        }

        document.addEventListener("keydown", function (ev) {
            if (ev.key === "Escape" && document.body.classList.contains("docs-open")) toggleDocs(false);
        });

        // A <details> menu does not close on an outside click by itself.
        document.addEventListener("click", function (ev) {
            var menu = document.querySelector(".examplesMenu");
            if (menu && menu.open && !menu.contains(ev.target)) menu.open = false;
        });

        window.onbeforeunload = function () {
            if (pynode_output !== undefined) {
                pynode_output.close();
            }
            if (pynode_docs !== undefined) {
                pynode_docs.close();
            }
            if (pynode_debug !== undefined) {
                pynode_debug.close();
            }
            if (pynode_editor !== undefined) {
                pynode_editor.close();
            }
            if (pynode_console !== undefined) {
                pynode_console.close();
            }
            if (editor_exists) {
                saveCode();
            }
        }
    </script>
    <script>
        var read_storage = true;
        var project_src;

        const searchParams = new URLSearchParams(window.location.search);

        if (searchParams.get("project")) {
            // Was `pair[1]`, an undefined variable, so ?project= threw and did nothing.
            var project_name = searchParams.get("project");
            read_storage = false;
            var client = new XMLHttpRequest();
            client.open("GET", "pynode_projects/" + project_name + ".py");
            client.onreadystatechange = function () {
                // Only readyState 4 is meaningful. The old `else` branch ran on states
                // 1/2/3 too, flipping read_storage back on and loading the stored code
                // before the request had even finished - so ?project= never worked.
                if (client.readyState != 4) return;
                if (client.status == 200) {
                    project_src = client.responseText;
                    if (editor_exists) applyCode(project_src);
                } else {
                    read_storage = true;
                    if (editor_exists) loadCode();
                }
            };
            client.send();
        }

    </script>
</head>

<!-- No ?version= on the AMD base path: Monaco's loader builds child-module URLs from it
     itself and will not propagate a query string. Bump the js/monaco/ directory name instead. -->
<script src="js/monaco/vs/loader.js"></script>
<script src="js/pynode_completions.js?version=0.9.11"></script>
<script src="js/monaco_setup.js?version=0.9.26"></script>
<script>
    resize();

    function getCode() {
        return window.editor ? window.editor.getValue() : "";
    }

    // Unconditional write, used by the project and file loaders.
    function applyCode(src) {
        if (window.editor) window.editor.setValue(src);
    }

    // Guarded write, used by the cross-window sync path.
    function setCode(src) {
        if (enable_editor) applyCode(src);
    }

    // Undoable write, for loading a file or an example over what the user had: one
    // Ctrl+Z puts their previous code back. applyCode resets the undo stack.
    function replaceCode(src) {
        if (window.editor) window.editor.replaceValue(src);
    }

    function saveCode() {
        localStorage.setItem("code", getCode())
    }

    function loadCode() {
        var src = localStorage.getItem("code");
        if (src === null || src === "") {
            openCode("dijkstra");
            return;
        }
        applyCode(src);
    }

    // `undoable`: the Examples menu passes true so the user can undo back to their own
    // code; the first-visit default load does not, as undoing to an empty editor is noise.
    function openCode(name, undoable) {
        var client = new XMLHttpRequest();
        client.open("GET", "pynode_projects/" + name + ".py");
        client.onreadystatechange = function () {
            if (client.readyState == 4) {
                if (editor_exists) {
                    (undoable ? replaceCode : applyCode)(client.responseText);
                    saveCode();
                }
            }
        };
        client.send();
    }

    PyNodeEditor.create({
        container: "editor",
        onReady: function () {
            if (read_storage) {
                loadCode();
            }
            if (project_src !== undefined) {
                applyCode(project_src);
            }
        }
    });
</script>
<script>
    function writeOutput(data, append) {
        var el = document.getElementById("console");
        if (el) {
            // insertAdjacentHTML, not innerHTML +=, which re-parses and replaces every
            // child - that would destroy the live <input> element (and its listeners)
            // that input() appends to the console while it waits for an answer.
            if (append) el.insertAdjacentHTML("beforeend", data);
            else el.innerHTML = data;
            el.scrollTop = el.scrollHeight;
        }
        // The `pynode_output === undefined &&` guard that used to be here suppressed the
        // forward whenever the output popup was open, so the detached console went silent.
        // With a single runtime there is one output stream and both consoles get it.
        try {
            if (pynode_console !== undefined && pynode_console && !pynode_console.closed) {
                pynode_console.writeOutput(data, append);
            }
        } catch (e) {}
    }

</script>

<input id="file-input" type="file" name="name" style="display: none;"/>
<script type="text/javascript" src="js/filesaver/filesaver.min.js?version=0.9.2"></script>
<script>
    function userLoadCode(event) {
        var files = event.target.files;
        var file = null;
        if (files.length > 0) file = files[0];
        else return;
        var reader = new FileReader();
        reader.onload = (function (theFile) {
            return function (e) {
                if (enable_editor) replaceCode(e.target.result);
            };
        })(file);
        reader.readAsText(file);
        // Otherwise choosing the same file again fires no change event.
        event.target.value = "";
    }

    function userSaveCode() {
        var text = getCode();
        var blob = new Blob([text], {type: "text/plain;charset=utf-8;"});
        saveAs(blob, "project.pynode");
    }

    document.getElementById('file-input').addEventListener('change', userLoadCode, false);
</script>
<script type="text/javascript">
    greuler_instance = greuler({
        target: '#output',
        width: 500,
        height: 400
    }).update();   // creates .root, as pynode_output.html does
    // The layout always works in a 500x400 space - the docs promise that size, and
    // node.set_position takes pixel coordinates against it - while css/style.css scales
    // the box to fit short viewports. The viewBox maps one onto the other; d3.mouse goes
    // through getScreenCTM, so clicks and drags still land on the right node.
    greuler_instance.root.attr("viewBox", "0 0 500 400").attr("preserveAspectRatio", "xMidYMid meet");
    // Apply whichever layout mode the buttons show (autosize by default). The mode used to
    // be applied only when a layout button was CLICKED, so the page showed one mode while
    // running another, and pan/zoom needed toggling away and back before it responded.
    set_layout_type();
</script>
<!-- Python now runs as real CPython inside js/pynode_worker.js. The button state machine
     that used to live in pynode_core.py (driven from Brython via document[...].bind) has
     moved into js/pynode_host.js, because a worker has no DOM. -->
<script src="js/pynode_host.js?version=0.9.27"></script>
<script>
    // The button background and cursor used to be set here as INLINE styles, which beat
    // any stylesheet rule and made the buttons untouchable by theming. They now live in
    // css/style.css under the #run/#stop/#restart rule.
    PyNodeHost.init();

    // The header run controls are focusable divs (role="button"); give them the keyboard
    // behaviour a real button has. .click() goes through whatever onclick PyNodeHost bound.
    ["run", "stop", "restart", "stepOver", "stepInto", "stepOut", "debugWindowButton"].forEach(function (id) {
        document.getElementById(id).addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); this.click(); }
        });
    });

    document.getElementById("layout1").onclick = function () {
        if (document.getElementById("layout1On").style.display === "none") {
            document.getElementById("layout1On").style.display = "inherit";
            document.getElementById("layout1Off").style.display = "none";
            document.getElementById("layout2On").style.display = "none";
            document.getElementById("layout2Off").style.display = "inherit";
            set_layout_type()
        }
    };
    document.getElementById("layout2").onclick = function () {
        if (document.getElementById("layout2On").style.display === "none") {
            document.getElementById("layout2On").style.display = "inherit";
            document.getElementById("layout2Off").style.display = "none";
            document.getElementById("layout1On").style.display = "none";
            document.getElementById("layout1Off").style.display = "inherit";
            set_layout_type()
        }
    };
</script>
