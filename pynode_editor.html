<!DOCTYPE html>

<html>
<head>
    <title>PyNode</title>
    <meta name="description" content="Interactive online Graph Theory.">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="coi-serviceworker.js"></script>
    <!-- Apply a stored theme before the stylesheet paints, so there is no flash of the
         wrong colours. Only writes the attribute when the user has chosen; while it is
         absent the stylesheet default applies, which is dark. -->
    <script>(function(){try{var t=localStorage.getItem("pynode-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
    <link href="css/style.css?version=0.9.13" rel="stylesheet" type="text/css">
    <script src="js/pynode_theme.js?version=0.9.11"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="js/resize.js?version=0.9.7"></script>

    <script>
        var enable_editor = true;
    </script>
</head>

<body class="pynode_editor">
<div class="pynodeEditorContainer">
    <div class="editorPageWrapper">
        <div class="editorWrapper">
            <div class="appSectionTitle">
                <div class="floatLeft">
                    <h3>Source</h3>
                </div>
                <div class="appSectionEnlarge">
                    <div class="appSectionBarIcon"><h3><a href=""
                                                          onclick="document.getElementById('file-input').click(); return false;"><img
                            src="images/controls/import.png" width="16" height="16"></a></h3></div>
                    <div class="appSectionBarIcon"><h3><a href="" onclick="userSaveCode(); return false;"><img
                            src="images/controls/save.png" width="16" height="16"></a></h3></div>
                </div>
            </div>
            <div id="editorBox">
                <div id="editor"></div>
            </div>
        </div>
    </div>
</div>
<script src="js/monaco/vs/loader.js"></script>
<script src="js/pynode_completions.js?version=0.9.11"></script>
<script src="js/monaco_setup.js?version=0.9.11"></script>
<script>
    function getCode() {
        return window.editor ? window.editor.getValue() : "";
    }
    function applyCode(src) {
        if (window.editor) window.editor.setValue(src);
    }
    function setCode(src) {
        if (enable_editor) applyCode(src);
    }

    // Seed once from the opener; after that the two editors stay in sync over
    // BroadcastChannel (see monaco_setup.js), which needs no opener relationship.
    // localStorage is the fallback when this page is opened directly.
    var seed = "";
    try {
        seed = window.opener ? window.opener.getCode() : (localStorage.getItem("code") || "");
    } catch (e) {
        seed = localStorage.getItem("code") || "";
    }

    PyNodeEditor.create({ container: "editor", value: seed });
</script>

<input id="file-input" type="file" name="name" style="display: none;"/>
<script type="text/javascript" src="js/filesaver/filesaver.min.js?version=0.9.2"></script>
<script>
    function userLoadCode(event) {
        var files = event.target.files;
        var file = null;
        if (files.length > 0) file = files[0];
        else return;
        var reader = new FileReader();
        reader.onload = (function (theFile) {
            return function (e) {
                setCode(e.target.result);
            };
        })(file);
        reader.readAsText(file);
    }
    function userSaveCode() {
        var text = getCode();
        var blob = new Blob([text], {type: "text/plain;charset=utf-8;"});
        saveAs(blob, "project.pynode");
    }
    document.getElementById('file-input').addEventListener('change', userLoadCode, false);
</script>

</body>
</html>
